{% extends "layout.html" %}

{% block title %}Manage Parties - Admin{% endblock %}

{% block content %}
<div class="section-header">
    <h2>Political Parties</h2>
    <a href="/admin" class="btn-secondary">Back to Admin</a>
</div>

<div class="admin-content mt-4">
    <div class="form-box">
        <h3>Register New Party</h3>
        <form method="POST">
            <div class="form-group">
                <label>Party Name</label>
                <input type="text" name="name" placeholder="e.g. Innovation Party" required>
            </div>
            <div class="form-group">
                <label>Theme Color (Hex)</label>
                <input type="color" name="color" value="#6366f1" style="height: 50px; padding: 5px;">
            </div>
            <div class="form-group">
                <label>Logo URL (Optional)</label>
                <input type="text" name="logo_url" placeholder="https://example.com/logo.png">
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" name="description" placeholder="Short slogans or mission statement">
            </div>
            <button type="submit" class="btn-primary">Create Party</button>
        </form>
    </div>

    <div class="list-box mt-8">
        <h3>Existing Parties</h3>
        <div class="party-list">
            {% for party in parties %}
            <div class="party-item" style="border-left: 5px solid {{ party.color }}">
                <div class="party-info">
                    <strong>{{ party.name }}</strong>
                    <p>{{ party.description }}</p>
                </div>
                <div class="party-stats">
                    <span class="badge">Seats: 0</span>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<style>
    .section-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 1rem; }
    .form-box { background: var(--glass); padding: 2rem; border-radius: 20px; border: 1px solid var(--glass-border); }
    .party-item { background: var(--glass); padding: 1rem 1.5rem; border-radius: 12px; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .party-info p { text-align: left; margin: 0; font-size: 0.875rem; }
</style>
{% endblock %}
