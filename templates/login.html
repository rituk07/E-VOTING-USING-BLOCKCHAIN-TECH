{% extends "layout.html" %}

{% block content %}
<div class="card reveal" style="max-width: 500px; margin: 4rem auto;">
    <h2 style="text-align: center;">Secure Login</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Access your voting dashboard.</p>

    <form method="POST">
        <div class="form-group">
            <label>Voter ID</label>
            <input type="text" name="voter_id" placeholder="Enter ID" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Password" required>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 2rem;">Sign In</button>
    </form>
    
    <p style="text-align: center; margin-top: 2rem; color: var(--text-muted);">
        New to VoterChain? <a href="/register" style="color: var(--primary); text-decoration: none; font-weight: 600;">Register Now</a>
    </p>
</div>
{% endblock %}
