{% extends "layout.html" %}

{% block content %}
<div class="card reveal" style="max-width: 800px; margin: 2rem auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 1.5rem; margin-bottom: 2.5rem;">
        <div>
            <h1>Official Ballot</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Identity Verified • Session Secure</p>
        </div>
        <div style="text-align: right;">
            <span style="background: rgba(34, 197, 94, 0.1); color: var(--success); padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.8rem; font-weight: 700; border: 1px solid rgba(34, 197, 94, 0.2);">🔒 BLOCKED PROXY</span>
        </div>
    </div>

    <form method="POST">
        <div class="candidates-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2rem;">
            <!-- Party 1: TSK -->
            <label class="candidate-item">
                <input type="radio" name="candidate" value="TSK" required>
                <div class="candidate-box">
                    <div class="avatar">🏛️</div>
                    <span class="name">TSK Party</span>
                    <span class="tag">Tradition & Strength</span>
                    <div class="check-mark">✓</div>
                </div>
            </label>

            <!-- Party 2: JCB -->
            <label class="candidate-item">
                <input type="radio" name="candidate" value="JCB">
                <div class="candidate-box">
                    <div class="avatar">🏗️</div>
                    <span class="name">JCB Party</span>
                    <span class="tag">Build & Progress</span>
                    <div class="check-mark">✓</div>
                </div>
            </label>

            <!-- Party 3: PKB -->
            <label class="candidate-item">
                <input type="radio" name="candidate" value="PKB">
                <div class="candidate-box">
                    <div class="avatar">⚡</div>
                    <span class="name">PKB Party</span>
                    <span class="tag">Power & Knowledge</span>
                    <div class="check-mark">✓</div>
                </div>
            </label>
        </div>

        <div style="margin-top: 4rem; border-top: 1px solid var(--glass-border); padding-top: 2rem; display: flex; justify-content: space-between; align-items: center;">
            <p style="font-size: 0.85rem; color: var(--text-muted); max-width: 400px;">
                By clicking "Cast Permanent Vote", your selection will be encrypted and stored on the immutable blockchain ledger. This action cannot be undone.
            </p>
            <button type="submit" class="btn-primary" style="padding: 1.2rem 3rem; font-size: 1.1rem;">Cast Permanent Vote</button>
        </div>
    </form>
</div>

<style>
    .candidate-item input { display: none; }
    .candidate-box { 
        background: rgba(255,255,255,0.03); 
        border: 2px solid var(--glass-border); 
        border-radius: 24px; 
        padding: 2.5rem 1.5rem; 
        text-align: center; 
        cursor: pointer; 
        transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
    }
    
    .candidate-item:hover .candidate-box { border-color: rgba(99, 102, 241, 0.3); transform: translateY(-8px); }
    
    .candidate-item input:checked + .candidate-box { 
        background: rgba(99, 102, 241, 0.1); 
        border-color: var(--primary);
        box-shadow: 0 10px 30px var(--primary-glow);
    }
    
    .avatar { font-size: 3rem; margin-bottom: 1.5rem; }
    .name { display: block; font-weight: 700; color: var(--text-main); font-size: 1.1rem; margin-bottom: 0.25rem; }
    .tag { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    
    .check-mark { 
        position: absolute; 
        top: 15px; 
        right: 15px; 
        width: 24px; 
        height: 24px; 
        background: var(--primary); 
        border-radius: 50%; 
        color: white; 
        font-size: 0.8rem; 
        display: flex; 
        align-items: center; 
        justify-content: center;
        opacity: 0;
        transform: scale(0);
        transition: 0.3s;
    }
    
    .candidate-item input:checked + .candidate-box .check-mark { opacity: 1; transform: scale(1); }
</style>
{% endblock %}
